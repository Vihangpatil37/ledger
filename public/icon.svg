<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d2824"/>
      <stop offset="100%" stop-color="#141210"/>
    </radialGradient>
  </defs>
  <!-- Main squircle container matching the in-app brand badge -->
  <rect width="512" height="512" rx="128" fill="#1e1b18"/>
  <rect width="512" height="512" rx="128" fill="url(#ringGlow)" opacity="0.4"/>
  <!-- Subtle border ring -->
  <rect x="6" y="6" width="500" height="500" rx="122" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8"/>
  <!-- Crisp, centered Rupee glyph matching the app header font -->
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#f8f6f0"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="310"
    letter-spacing="-2px"
  >₹</text>
</svg>
